<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <meta name="description" content="Скачивайте свои видео, Shorts и обложки с YouTube.">
  <meta name="referrer" content="no-referrer">
  <title>Videoport — скачать видео с YouTube</title>
  <link rel="stylesheet" href="./docs/styles.css">
  <script type="module" src="./docs/app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l3.1-3.1a4 4 0 1 0-5.7-5.7l-1.8 1.8M14 10.5a4 4 0 0 0-5.7 0l-3.1 3.1a4 4 0 0 0 5.7 5.7l1.8-1.8"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a2 2 0 0 1 2-2h2m1 8h6m-6 4h4"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M17 21H5a2 2 0 0 1-2-2V7m8 3h6m-6 3h4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m-4-4 4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 16-5-5L6 21"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </svg>

  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="./"><span><svg aria-hidden="true"><use href="#i-play"></use></svg></span>Videoport</a>
      <a class="source" href="https://github.com/Poklontsevv/downloader" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <main class="shell">
    <section class="search" aria-labelledby="page-title">
      <h1 id="page-title">Скачать видео<br><span>с YouTube</span></h1>
      <p class="subtitle">Обычные видео, Shorts и обложки. Вставьте ссылку и выберите качество.</p>
      <div class="search-card">
        <form id="search-form" novalidate>
          <div id="single-input">
            <label for="link">Ссылка на YouTube</label>
            <div class="search-line">
              <div class="link-field">
                <svg aria-hidden="true"><use href="#i-link"></use></svg>
                <input id="link" type="url" name="link" autocomplete="off" spellcheck="false" aria-describedby="input-error" placeholder="https://www.youtube.com/watch?v=…">
                <button class="button icon-button" id="paste" type="button" aria-label="Вставить ссылку из буфера" title="Вставить из буфера"><svg aria-hidden="true"><use href="#i-paste"></use></svg></button>
              </div>
              <button class="button primary" id="find-single" type="submit">Найти видео</button>
            </div>
          </div>
          <div id="batch-input" hidden>
            <label for="links">Ссылки на YouTube</label>
            <textarea id="links" name="links" rows="4" aria-describedby="batch-hint input-error" spellcheck="false" placeholder="https://www.youtube.com/watch?v=…"></textarea>
            <div class="batch-form-actions">
              <p id="batch-hint">По одной ссылке на строку, до 50 за раз.</p>
              <button class="button primary" id="find-batch" type="submit">Найти видео</button>
            </div>
          </div>
          <p class="error" id="input-error" role="alert" hidden></p>
          <div class="form-footer">
            <button class="button text-button" id="batch-toggle" type="button" aria-pressed="false"><svg aria-hidden="true"><use href="#i-stack"></use></svg><span>Пакетная загрузка</span></button>
            <span class="request-state" id="request-state" role="status"></span>
            <button class="button text-button" id="open-downloads" type="button" hidden>Открыть папку загрузок</button>
          </div>
        </form>
      </div>
      <aside id="connection-help" class="setup" hidden>
        <div>
          <h2>Подключите загрузчик</h2>
          <p id="setup-detail"></p>
          <code id="setup-command" hidden>python -m videoport --allow-pages</code>
          <a id="setup-guide" href="https://github.com/Poklontsevv/downloader#локальный-запуск" hidden>Инструкция по запуску</a>
        </div>
        <div class="setup-actions">
          <button class="button secondary" id="connect" type="button">Подключить</button>
          <a class="button quiet" id="open-local" href="http://127.0.0.1:8765/" hidden>Открыть локально</a>
        </div>
      </aside>
    </section>

    <section id="results" aria-label="Результаты" hidden>
      <div class="batch-bar" id="batch-bar" hidden>
        <label class="check-label"><input type="checkbox" id="select-all"> Выбрать все</label>
        <div class="batch-actions">
          <button type="button" class="button secondary" id="batch-covers">Скачать обложки</button>
          <button type="button" class="button primary" id="batch-download">Скачать выбранные</button>
        </div>
      </div>
      <p id="feedback" class="feedback" role="status" hidden></p>
      <ul id="result-list" class="result-list"></ul>
    </section>
  </main>

  <template id="video-template">
    <li class="result">
      <div class="preview">
        <div class="image-box">
          <svg aria-hidden="true"><use href="#i-play"></use></svg>
          <img alt="" hidden>
          <span class="duration" hidden></span>
        </div>
      </div>
      <div class="result-body">
        <div class="result-heading">
          <div>
            <h2 class="video-title"></h2>
            <p class="channel"></p>
          </div>
          <input class="video-check" type="checkbox" hidden>
        </div>
        <p class="video-error error" hidden></p>
        <button class="button secondary retry" type="button" hidden>Повторить поиск</button>
        <div class="export" hidden>
          <label class="quality-label">Качество <select class="quality"></select></label>
          <div class="download-actions">
            <button class="button primary save-video" type="button"><svg aria-hidden="true"><use href="#i-download"></use></svg> Скачать видео</button>
            <button class="button secondary save-cover" type="button"><svg aria-hidden="true"><use href="#i-image"></use></svg> Скачать обложку</button>
          </div>
          <details class="advanced">
            <summary>Формат и параметры</summary>
            <label class="format-label">Формат файла
              <select class="format"><option value="mp4">MP4 · H.264 / AAC</option><option value="mkv">MKV · исходные дорожки</option></select>
            </label>
            <label class="check-label"><input type="checkbox" class="include-cover"> Скачать обложку вместе с видео</label>
          </details>
        </div>
        <ul class="files" aria-label="Файлы" hidden></ul>
        <button class="button text-button remove" type="button" hidden><svg aria-hidden="true"><use href="#i-x"></use></svg>Убрать из списка</button>
      </div>
    </li>
  </template>
</body>
</html>
